<div class="profile-menu">
  <button class="profile-btn" (click)="toggle()" [attr.aria-expanded]="open()" aria-haspopup="true" type="button">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
    </svg>
  </button>

  @if (open()) {
    <div class="dropdown" role="menu">
      <button class="dropdown-item dropdown-item--logout" (click)="onLogout()" role="menuitem" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        {{ t().nav.logout }}
      </button>
      <button class="dropdown-item dropdown-item--disabled" disabled role="menuitem" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"/><path d="M22 12a10 10 0 0 1-10 10A10 10 0 0 1 2 12"/></svg>
        {{ t().nav.settings }}
      </button>
    </div>
  }
</div>
