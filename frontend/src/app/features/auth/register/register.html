<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">{{ t().auth.signUp }}</h1>

    <div class="field">
      <label class="label" for="name">{{ t().auth.name }}</label>
      <input
        id="name"
        class="input"
        type="text"
        autocomplete="name"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
      />
    </div>

    <div class="field">
      <label class="label" for="email">{{ t().auth.email }}</label>
      <input
        id="email"
        class="input"
        type="email"
        autocomplete="email"
        [value]="email()"
        (input)="email.set($any($event.target).value)"
      />
    </div>

    <div class="field">
      <label class="label" for="password">{{ t().auth.password }}</label>
      <input
        id="password"
        class="input"
        type="password"
        autocomplete="new-password"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
        (keydown.enter)="submit()"
      />
    </div>

    @if (status() === 'error') {
      <p class="feedback error">{{ t().auth.error }}</p>
    }

    <button class="submit-btn" type="button" [disabled]="!canSubmit" (click)="submit()">
      @if (status() === 'loading') { {{ t().auth.signingUp }} } @else { {{ t().auth.signUp }} }
    </button>

    <a class="switch-link" routerLink="/login">{{ t().auth.hasAccount }}</a>
  </div>
</div>
